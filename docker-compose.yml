version: "3.9"

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: insurance_rag_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
      POSTGRES_DB: insurance_rag
    ports:
      - "5433:5432" # Mapped to another port
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  # Phase 4: local trace viewer. The app exports OTLP/HTTP traces to
  # this container; open http://localhost:16686 to see them.
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: insurance_rag_jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # Jaeger UI
      - "4318:4318" # OTLP HTTP receiver (matches OTEL_EXPORTER_OTLP_ENDPOINT default)

volumes:
  pgdata:
